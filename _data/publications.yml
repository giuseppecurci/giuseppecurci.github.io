- title: "Exploring the Limits of the Delta Learning Hypothesis: Single-Pair Generator Biases in Direct Preference Optimization"
  paper_url: "https://arxiv.org/abs/2610.37058"
  image: "/assets/images/delta-learning.png"
  image_alt: "Figure from the delta learning preprint"
  image_width: 230
  image_height: 105
  authors:
    - name: "Giuseppe Curci"
      self: true
    - name: "Stefano Simonazzi"
    - name: "Andrea Molinari"
    - name: "Andrea Zugarini"
  venue: "arXiv preprint"
  month: "Oct"
  year: 2026
  links:
    - label: "Paper"
      url: "https://arxiv.org/abs/2610.37058"
      icon: "paper"
  summary: "DPO usually relies on an external LLM judge to rank responses. A chepear alternative was proposed: just use two models and consider the response from the bigger model as the chosen. But there's a catch: models have distinctive fingerprints beyond response quality that introduce systematic biases, allowing the model to learn who generated an answer rather than why it is better, which inevitably degrades trainings gain. Increasing generator diversity substantially mitigates these shortcuts, even without an external judge. The takeaway: diverse generators may matter just as much as sophisticated preference-ranking strategies."

