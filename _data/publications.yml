    - label: "Code"
      url: "https://github.com/giuseppecurci/Merge-LLM-Pre-Training"
      icon: "github"
  summary: "We study checkpoint merging during LLM pre-training and find that simple averaging works best during stable learning-rate phases, with diminishing gains during decay as checkpoint diversity shrinks. We also show that merging results reliably predict the improvements achievable through short learning-rate decay phases."

- title: "Ensembling Pruned Attention Heads For Uncertainty-Aware Efficient Transformers"
