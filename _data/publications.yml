  summary: "Deep Ensembles achieve strong uncertainty quantification but are costly to scale to large models. Hydra Ensembles prunes attention heads to create diverse members (head sets) and fuses them in one single MHA block, leveraging grouped fully connected layers to yield near single model inference speed while matching or surpassing Deep Ensembles without retraining from scratch."